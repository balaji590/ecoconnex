<script>
// ── CART UI (identical behaviour to every other page) ──
function updateCartUI() {
  var cart = window.EcoConnex.cart.getCart();
  var total = window.EcoConnex.cart.getTotal();
  var count = window.EcoConnex.cart.getCount();
  var totalSavings = window.EcoConnex.cart.getTotalSavings();
  var badge = document.getElementById('cartBadge');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';
  var container = document.getElementById('cartItems');
  var footer = document.getElementById('cartFooter');
  document.getElementById('cartTotal').textContent = '₹' + total.toLocaleString('en-IN');
  var summaryExtra = document.getElementById('cartSummaryExtra');
  if (totalSavings > 0) {
    document.getElementById('cartMrpTotal').textContent = '₹' + window.EcoConnex.cart.getTotalMRP().toLocaleString('en-IN');
    document.getElementById('cartSavingsTotal').textContent = '₹' + totalSavings.toLocaleString('en-IN');
    summaryExtra.style.display = 'block';
  } else {
    summaryExtra.style.display = 'none';
  }
  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty"><i class="ti ti-shopping-cart-off"></i><p>Your cart is empty</p></div>';
    footer.style.display = 'none';
    return;
  }
  footer.style.display = 'block';
  var priceNote = window.EcoConnex.cart.hasCallForPrice()
    ? '<div class="cart-price-note"><i class="ti ti-info-circle"></i> Price will be confirmed by Eco Connex</div>'
    : '';
  container.innerHTML = priceNote + cart.map(function (item) {
    var priceLine;
    if (item.price === null) {
      priceLine = 'Price on Request × ' + item.qty;
    } else {
      var unitLine = '₹' + item.price.toLocaleString('en-IN');
      if (item.mrp && item.mrp > item.price) {
        var pct = Math.round((item.mrp - item.price) / item.mrp * 100);
        unitLine += ' <span class="price-mrp">₹' + item.mrp.toLocaleString('en-IN') + '</span> <span class="price-off-badge">' + pct + '% OFF</span>';
      }
      priceLine = unitLine + ' × ' + item.qty + ' = ₹' + (item.price * item.qty).toLocaleString('en-IN');
    }
    return '<div class="cart-item"><div class="cart-item-icon">' + window.EcoConnex.renderProductImageHtml({image:item.image,icon:item.icon,name:item.name},{width:44,height:44}) + '</div><div class="cart-item-info"><div class="cart-item-name">' + item.name + '</div><div class="cart-item-price">' + priceLine + '</div><div class="cart-item-qty"><button class="qty-btn" aria-label="Decrease quantity" onclick="EcoConnex.cart.updateQty(\'' + item.sku + '\',-1)">−</button><span class="qty-num">' + item.qty + '</span><button class="qty-btn" aria-label="Increase quantity" onclick="EcoConnex.cart.updateQty(\'' + item.sku + '\',1)">+</button></div></div><button class="cart-item-remove" onclick="EcoConnex.cart.removeItem(\'' + item.sku + '\')" title="Remove" aria-label="Remove item"><i class="ti ti-trash"></i></button></div>';
  }).join('');
}
window.EcoConnex.cart.onChange(updateCartUI);

function openCart() { document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartSidebar').classList.add('open'); }
function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartSidebar').classList.remove('open'); }

// ── BLOG POST RENDER ──
function getSlugFromUrl() {
  return new URLSearchParams(window.location.search).get('slug');
}

function renderNotFound() {
  document.getElementById('postRoot').innerHTML =
    '<div class="blog-post-loading"><i class="ti ti-mood-sad" style="animation:none;"></i>Article not found.<br/><a href="blog.html" style="color:var(--orange-dark);font-weight:600;">Browse all articles →</a></div>';
  document.getElementById('breadcrumbCurrent').textContent = 'Not found';
}

function renderRelated(posts, current) {
  var related = window.EcoConnex.getRelatedPosts(posts, current, 3);
  if (!related.length) return '';
  return (
    '<div class="blog-related">' +
      '<h3>More Guides</h3>' +
      '<div class="blog-related-grid">' +
        related.map(function (p) {
          return '<a href="blog-post.html?slug=' + encodeURIComponent(p.slug) + '" class="blog-related-card">' +
            '<div class="blog-card-cat">' + window.EcoConnex.escapeHtml(p.category) + '</div>' +
            '<div class="blog-related-title">' + window.EcoConnex.escapeHtml(p.title) + '</div>' +
          '</a>';
        }).join('') +
      '</div>' +
    '</div>'
  );
}

function renderPost(post, allPosts) {
  const EC = window.EcoConnex;
  const pageUrl = 'https://ecoconnex.in/blog-post.html?slug=' + post.slug;

  document.title = post.title + ' | Eco Connex Blog';
  document.getElementById('pageTitle').textContent = post.title + ' | Eco Connex Blog';
  document.getElementById('pageDesc').setAttribute('content', post.excerpt);
  document.getElementById('pageCanonical').setAttribute('href', pageUrl);
  document.getElementById('ogTitle').setAttribute('content', post.title);
  document.getElementById('ogDesc').setAttribute('content', post.excerpt);
  document.getElementById('ogUrl').setAttribute('content', pageUrl);
  document.getElementById('twTitle').setAttribute('content', post.title);
  document.getElementById('twDesc').setAttribute('content', post.excerpt);
  document.getElementById('breadcrumbCurrent').textContent = post.title;

  const breadcrumbLd = {
    "@context": "https://schema.org", "@type": "BreadcrumbList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://ecoconnex.in/"},
      {"@type": "ListItem", "position": 2, "name": "Blog", "item": "https://ecoconnex.in/blog.html"},
      {"@type": "ListItem", "position": 3, "name": post.title, "item": pageUrl}
    ]
  };
  const articleLd = {
    "@context": "https://schema.org", "@type": "Article",
    "headline": post.title, "description": post.excerpt, "url": pageUrl,
    "datePublished": post.publishDate,
    "author": {"@type": "Organization", "name": "Eco Connex"},
    "publisher": {"@id": "https://ecoconnex.in/#organization"}
  };
  [breadcrumbLd, articleLd].forEach(function (ld) {
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(ld);
    document.head.appendChild(s);
  });

  document.getElementById('postRoot').className = 'blog-post-content';
  document.getElementById('postRoot').innerHTML =
    '<div class="blog-post-header">' +
      '<div class="blog-card-cat">' + EC.escapeHtml(post.category) + '</div>' +
      '<h1>' + EC.escapeHtml(post.title) + '</h1>' +
      '<div class="blog-post-meta"><i class="ti ti-calendar"></i> ' + EC.escapeHtml(EC.formatBlogDate(post.publishDate)) + ' &nbsp;·&nbsp; <i class="ti ti-clock"></i> ' + EC.escapeHtml(post.readTime) + '</div>' +
    '</div>' +
    '<div class="blog-post-body">' + EC.renderBlogContentHtml(post.content, EC.escapeHtml) + '</div>' +
    renderRelated(allPosts, post);
}

const slug = getSlugFromUrl();
Promise.all([window.EcoConnex.loadBlogPosts()]).then(function (results) {
  const posts = results[0];
  if (!slug) { renderNotFound(); return; }
  const post = window.EcoConnex.getPostBySlug(posts, slug);
  if (!post) { renderNotFound(); return; }
  renderPost(post, posts);
});

document.addEventListener('DOMContentLoaded', function () {
  var fadeEls=document.querySelectorAll('.fade-up');
  var observer=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target);}});},{threshold:0.12});
  fadeEls.forEach(function(el){observer.observe(el);});
});
</script>
