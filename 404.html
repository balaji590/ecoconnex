</head>
<body class="category-page">

<div id="site-header"></div>

<main>
<div class="breadcrumb">
  <a href="/index.html">Home</a><i class="ti ti-chevron-right"></i>
  <span class="current">Page Not Found</span>
</div>

<section class="hero category-hero category-hero--no-image" aria-labelledby="pageHeroTitle">
  <div class="category-hero-inner">
    <div class="category-hero-left">
      <h1 id="pageHeroTitle">Page Not Found</h1>
      <p class="category-hero-description">The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:24px;">
        <a href="/index.html" class="btn-orange" style="display:inline-flex;align-items:center;gap:8px;padding:12px 26px;font-size:14px;"><i class="ti ti-home"></i> Back to Home</a>
        <a href="/products.html" class="btn-orange" style="display:inline-flex;align-items:center;gap:8px;padding:12px 26px;font-size:14px;background:#fff;color:var(--gray-900);border:1.5px solid var(--gray-200);"><i class="ti ti-packages"></i> Browse Products</a>
      </div>
    </div>
  </div>
</section>
</main>

<div id="site-footer"></div>

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3><i class="ti ti-shopping-cart"></i> Your Cart</h3>
    <button class="cart-close" onclick="closeCart()" aria-label="Close cart"><i class="ti ti-x"></i></button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter" style="display:none;">
    <div class="cart-total-row"><span>Total</span><strong id="cartTotal">₹0</strong></div>
    <button class="btn-cart-checkout" onclick="EcoConnex.openCheckoutModal()"><i class="ti ti-brand-whatsapp"></i> Checkout via WhatsApp</button>
  </div>
</div>

<script src="/assets/js/products-data.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/wishlist.js"></script>
<script src="/assets/js/category-nav.js"></script>
<script src="/assets/js/orders.js"></script>
<script src="/assets/js/checkout.js"></script>
<script src="/assets/js/search-widget.js"></script>
<script src="/assets/js/shared-layout.js"></script>
<script>
function updateCartUI() {
  var cart = window.EcoConnex.cart.getCart();
  var total = window.EcoConnex.cart.getTotal();
  var count = window.EcoConnex.cart.getCount();
  var badge = document.getElementById('cartBadge');
  if (badge) { badge.textContent = count; badge.style.display = count > 0 ? 'flex' : 'none'; }
  var container = document.getElementById('cartItems');
  var footer = document.getElementById('cartFooter');
  if (document.getElementById('cartTotal')) document.getElementById('cartTotal').textContent = '₹' + total.toLocaleString('en-IN');
  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty"><i class="ti ti-shopping-cart-off"></i><p>Your cart is empty</p></div>';
    footer.style.display = 'none';
    return;
  }
  footer.style.display = 'block';
  container.innerHTML = cart.map(function (item) {
    return '<div class="cart-item"><div class="cart-item-icon">' + window.EcoConnex.renderProductImageHtml({image:item.image,icon:item.icon,name:item.name},{width:44,height:44}) + '</div><div class="cart-item-info"><div class="cart-item-name">' + item.name + '</div><div class="cart-item-qty"><button class="qty-btn" onclick="EcoConnex.cart.updateQty(\'' + item.sku + '\',-1)">−</button><span class="qty-num">' + item.qty + '</span><button class="qty-btn" onclick="EcoConnex.cart.updateQty(\'' + item.sku + '\',1)">+</button></div></div><button class="cart-item-remove" onclick="EcoConnex.cart.removeItem(\'' + item.sku + '\')"><i class="ti ti-trash"></i></button></div>';
  }).join('');
}
window.EcoConnex.cart.onChange(updateCartUI);
function openCart() { document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartSidebar').classList.add('open'); }
function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartSidebar').classList.remove('open'); }
</script>
</body>
</html>
